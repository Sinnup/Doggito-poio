# gradle/libs.versions.toml

[versions]
# Build toolchain
agp                         = "8.10.1"
kotlin                      = "2.1.21"
ksp                         = "2.1.21-1.0.29"

# AndroidX core
compileSdk                  = "36"
minSdk                      = "24"
targetSdk                   = "36"
coreKtx                     = "1.10.1"
appcompat                   = "1.6.1"
activityKtx                 = "1.7.2"

# Lifecycle
lifecycle                   = "2.6.1"

# Navigation
navigation                  = "2.7.0"

# Compose
composeBom                  = "2025.05.00"
activityCompose             = "1.7.2"
hiltNavigationCompose       = "1.0.0"

# Material
material                    = "1.9.0"

# Constraint / layout
constraintlayout            = "2.1.3"

# Hilt
hilt                        = "2.56.1"

# Retrofit / Moshi
retrofit                    = "2.9.0"

# Coil
coil                        = "2.4.0"

# CameraX
camerax                     = "1.2.3"

# TensorFlow Lite
tensorflowLite              = "2.12.0"
tensorflowLiteSupport       = "0.4.4"

# Test
junit                       = "4.13.2"
androidxJunit               = "1.1.5"
espressoCore                = "3.5.1"
coroutinesTest              = "1.7.3"


[libraries]
# AndroidX core
androidx-core-ktx                       = { group = "androidx.core",              name = "core-ktx",                      version.ref = "coreKtx" }
androidx-appcompat                      = { group = "androidx.appcompat",          name = "appcompat",                     version.ref = "appcompat" }
androidx-activity-ktx                   = { group = "androidx.activity",           name = "activity-ktx",                  version.ref = "activityKtx" }
androidx-constraintlayout               = { group = "androidx.constraintlayout",   name = "constraintlayout",              version.ref = "constraintlayout" }

# Lifecycle
androidx-lifecycle-runtime-ktx          = { group = "androidx.lifecycle",          name = "lifecycle-runtime-ktx",         version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx        = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",   version.ref = "lifecycle" }

# Navigation (fragment + XML, kept for Safe Args migration period)
androidx-navigation-fragment-ktx        = { group = "androidx.navigation",         name = "navigation-fragment-ktx",       version.ref = "navigation" }
androidx-navigation-ui-ktx              = { group = "androidx.navigation",         name = "navigation-ui-ktx",             version.ref = "navigation" }
androidx-navigation-compose             = { group = "androidx.navigation",         name = "navigation-compose",            version.ref = "navigation" }

# Compose BOM and platform
androidx-compose-bom                    = { group = "androidx.compose",            name = "compose-bom",                   version.ref = "composeBom" }
# All entries below are BOM-managed (no version.ref needed)
androidx-compose-ui                     = { group = "androidx.compose.ui",         name = "ui" }
androidx-compose-ui-graphics            = { group = "androidx.compose.ui",         name = "ui-graphics" }
androidx-compose-ui-tooling             = { group = "androidx.compose.ui",         name = "ui-tooling" }
androidx-compose-ui-tooling-preview     = { group = "androidx.compose.ui",         name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4         = { group = "androidx.compose.ui",         name = "ui-test-junit4" }
androidx-compose-ui-test-manifest       = { group = "androidx.compose.ui",         name = "ui-test-manifest" }
androidx-compose-foundation             = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material               = { group = "androidx.compose.material",   name = "material" }
androidx-compose-material-icons-core    = { group = "androidx.compose.material",   name = "material-icons-core" }
androidx-compose-material-icons-extended= { group = "androidx.compose.material",   name = "material-icons-extended" }
androidx-compose-material3              = { group = "androidx.compose.material3",  name = "material3" }
androidx-compose-material3-window-size  = { group = "androidx.compose.material3",  name = "material3-window-size-class" }
androidx-activity-compose               = { group = "androidx.activity",           name = "activity-compose",              version.ref = "activityCompose" }

# Hilt navigation for Compose (not BOM-managed)
androidx-hilt-navigation-compose        = { group = "androidx.hilt",              name = "hilt-navigation-compose",       version.ref = "hiltNavigationCompose" }

# Material (View-based)
google-material                         = { group = "com.google.android.material", name = "material",                     version.ref = "material" }

# Hilt
hilt-android                            = { group = "com.google.dagger",           name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                           = { group = "com.google.dagger",           name = "hilt-compiler",                 version.ref = "hilt" }
hilt-android-testing                    = { group = "com.google.dagger",           name = "hilt-android-testing",          version.ref = "hilt" }
hilt-android-compiler                   = { group = "com.google.dagger",           name = "hilt-android-compiler",         version.ref = "hilt" }

# Retrofit
retrofit                                = { group = "com.squareup.retrofit2",      name = "retrofit",                      version.ref = "retrofit" }
retrofit-converter-moshi                = { group = "com.squareup.retrofit2",      name = "converter-moshi",               version.ref = "retrofit" }

# Coil
coil                                    = { group = "io.coil-kt",                  name = "coil",                          version.ref = "coil" }
coil-compose                            = { group = "io.coil-kt",                  name = "coil-compose",                  version.ref = "coil" }

# CameraX
camerax-camera2                         = { group = "androidx.camera",             name = "camera-camera2",                version.ref = "camerax" }
camerax-lifecycle                       = { group = "androidx.camera",             name = "camera-lifecycle",              version.ref = "camerax" }
camerax-view                            = { group = "androidx.camera",             name = "camera-view",                   version.ref = "camerax" }

# TensorFlow Lite
tensorflow-lite                         = { group = "org.tensorflow",              name = "tensorflow-lite",               version.ref = "tensorflowLite" }
tensorflow-lite-support                 = { group = "org.tensorflow",              name = "tensorflow-lite-support",       version.ref = "tensorflowLiteSupport" }

# Test rules
androidx-test-rules                     = { group = "androidx.test",               name = "rules",                         version = "1.5.0" }

# Test
junit                                   = { group = "junit",                       name = "junit",                         version.ref = "junit" }
androidx-test-junit                     = { group = "androidx.test.ext",           name = "junit",                         version.ref = "androidxJunit" }
androidx-espresso-core                  = { group = "androidx.test.espresso",      name = "espresso-core",                 version.ref = "espressoCore" }
androidx-espresso-idling-resource       = { group = "androidx.test.espresso",      name = "espresso-idling-resource",      version.ref = "espressoCore" }
kotlinx-coroutines-test                 = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",       version.ref = "coroutinesTest" }


[plugins]
android-application                     = { id = "com.android.application",                    version.ref = "agp" }
android-library                         = { id = "com.android.library",                        version.ref = "agp" }
kotlin-android                          = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-parcelize                        = { id = "org.jetbrains.kotlin.plugin.parcelize",      version.ref = "kotlin" }
kotlin-kapt                             = { id = "org.jetbrains.kotlin.kapt",                  version.ref = "kotlin" }
hilt-android                            = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
navigation-safe-args                    = { id = "androidx.navigation.safeargs.kotlin",        version.ref = "navigation" }
kotlin-compose-compiler                 = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
ksp                                     = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }


[bundles]
compose-ui                              = ["androidx-compose-ui","androidx-compose-ui-graphics","androidx-compose-ui-tooling-preview","androidx-compose-foundation"]
compose-material3                       = ["androidx-compose-material3","androidx-compose-material3-window-size"]
compose-material-icons                  = ["androidx-compose-material-icons-core","androidx-compose-material-icons-extended"]
compose-debug                           = ["androidx-compose-ui-tooling","androidx-compose-ui-test-manifest"]
compose-android-test                    = ["androidx-compose-ui-test-junit4"]
camerax                                 = ["camerax-camera2","camerax-lifecycle","camerax-view"]
retrofit                                = ["retrofit","retrofit-converter-moshi"]
coil                                    = ["coil","coil-compose"]
hilt-runtime                            = ["hilt-android","androidx-hilt-navigation-compose"]
hilt-android-test                       = ["hilt-android-testing"]
androidx-core                           = ["androidx-core-ktx","androidx-appcompat","google-material"]
test-unit                               = ["junit"]
test-android                            = ["androidx-test-junit","androidx-espresso-core"]
