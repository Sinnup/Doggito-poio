plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose.compiler)
    id 'kotlin-parcelize'
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt.android)
    alias(libs.plugins.kotlin.serialization)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

android {
    namespace 'com.espert.dogedex'
    compileSdk libs.versions.compileSdk.get().toInteger()

    signingConfigs {
        release {
            storeFile file(localProperties['RELEASE_STORE_FILE'] ?: '')
            storePassword localProperties['RELEASE_STORE_PASSWORD'] ?: ''
            keyAlias localProperties['RELEASE_KEY_ALIAS'] ?: ''
            keyPassword localProperties['RELEASE_KEY_PASSWORD'] ?: ''
        }
    }

    defaultConfig {
        applicationId "com.espert.dogedex"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 100003
        versionName "1.0.1"

        testInstrumentationRunner "com.espert.dogedex.CustomTestRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("doggito-poio_${variant.name}.apk")
        }
    }
}

tasks.configureEach { task ->
    if (task.name ==~ /bundle[A-Z].*/) {
        def buildDirPath = layout.buildDirectory.get().asFile.absolutePath
        task.doLast {
            def variantName = task.name.substring('bundle'.length())
            variantName = variantName[0].toLowerCase() + variantName.substring(1)
            def bundleDir = new File("${buildDirPath}/outputs/bundle/${variantName}")
            if (bundleDir.exists()) {
                bundleDir.listFiles()?.findAll { it.name.endsWith('.aab') }?.each { f ->
                    f.renameTo(new File(bundleDir, "doggito-poio_${variantName}.aab"))
                }
            }
        }
    }
}

